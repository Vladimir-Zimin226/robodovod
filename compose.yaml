name: robodovod

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
      APP_DB_USER: "${APP_DB_USER:?Set APP_DB_USER in .env}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-init-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      YC_FOLDER_ID: "${YC_FOLDER_ID:-}"
      YC_API_KEY: "${YC_API_KEY:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-43200}"
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      CATALOG_RUNTIME_SOURCE: "${CATALOG_RUNTIME_SOURCE:-legacy}"
      OFFICIAL_CATALOG_BUNDLE_PATH: "/data/import/organizer-catalog-v4"
      PROJECT_FILE_STORAGE_ROOT: "/data/uploads"
      DELETION_TOMBSTONE_DAYS: "${DELETION_TOMBSTONE_DAYS:-30}"
    volumes:
      - project_uploads:/data/uploads
      - ./data/import:/data/import:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true

  catalog-import:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["python", "-m", "catalog_importer"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    volumes:
      - ./data/import:/data/import:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    init: true

  catalog-dual-run:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["python", "-m", "catalog_dual_run"]
    command:
      - "--catalog-code"
      - "organizer-catalog-v4"
      - "--fixture"
      - "fixtures/catalog-dual-run-warehouse-v1.json"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      CATALOG_DUAL_RUN_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    init: true

  catalog-activation:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["python", "-m", "catalog_activation"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      OFFICIAL_CATALOG_BUNDLE_PATH: "/data/import/organizer-catalog-v4"
    volumes:
      - ./data/import:/data/import:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    init: true

  admin-bootstrap:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["python", "-m", "bootstrap_admin"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    init: true

  persistence-maintenance:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["python", "-m", "persistence_maintenance"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true

volumes:
  postgres_data:
  project_uploads:
