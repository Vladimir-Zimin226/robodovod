name: robodovod

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      YC_FOLDER_ID: "${YC_FOLDER_ID:-}"
      YC_API_KEY: "${YC_API_KEY:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
